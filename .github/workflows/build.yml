name: Build TrollStore Tweak


on:

  workflow_dispatch:

    inputs:

      project:

        description: "选择编译插件"

        required: true

        default: "WoAiKaAdFree"


  push:

    branches:

      - main



jobs:


  build:


    runs-on: macos-14


    env:

      PROJECT: ${{ github.event.inputs.project || 'WoAiKaAdFree' }}



    steps:


      - name: Checkout

        uses: actions/checkout@v4



      - name: Show Project

        run: |

          echo "======================"

          echo "BUILD PROJECT: $PROJECT"

          echo "======================"

          ls -la Projects/$PROJECT



      - name: Install Theos

        run: |

          git clone --recursive \
          https://github.com/theos/theos.git \
          $HOME/theos


          echo "THEOS=$HOME/theos" >> $GITHUB_ENV



      - name: Install SDK

        run: |

          mkdir -p $HOME/theos/sdks


          git clone --depth=1 \
          https://github.com/theos/sdks.git \
          $HOME/theos/sdks



      - name: Install Tools

        run: |

          brew install ldid || true



      # ===============================
      # 创建当前插件工程
      # ===============================

      - name: Prepare Project


        run: |


          echo "Prepare $PROJECT"


          cp Projects/$PROJECT/Tweak.xm ./Tweak.xm


          cp Projects/$PROJECT/config.json ./config.json



          echo "===== Tweak.xm ====="


          head -20 Tweak.xm



          echo "===== Config ====="


          cat config.json



      # ===============================
      # 自动生成配置
      # ===============================


      - name: Generate Config


        run: |


          chmod +x Scripts/*.sh


          ./Scripts/make_config.sh


          ./Scripts/make_filter.sh



          echo "===== Filter ====="


          cat Filter.plist



      # ===============================
      # 编译
      # ===============================


      - name: Build


        run: |


          export THEOS=$HOME/theos


          make clean


          make FINALPACKAGE=1



      # ===============================
      # 检查
      # ===============================


      - name: Check Output


        run: |


          echo "===== DYLIB ====="


          find . -name "*.dylib"



          echo "===== PACKAGE ====="


          find . -name "*.deb"



      # ===============================
      # 输出
      # ===============================


      - name: Package


        run: |


          mkdir -p output



          cp .theos/obj/*.dylib output/ || true



          cp .theos/obj/arm64e/*.dylib output/ || true



          ls -al output



      - name: Upload


        uses: actions/upload-artifact@v4


        with:


          name: ${{ env.PROJECT }}-dylib


          path: output/*.dylib
