name: Build TrollStore Tweak


on:

  workflow_dispatch:

    inputs:

      project:

        description: "选择要编译的插件"

        required: true

        default: "WoAiKaAdFree"



  push:

    branches:

      - main



jobs:


  build:


    runs-on: macos-14


    env:

      PROJECT: ${{ github.event.inputs.project || 'WoAiKaAdFree' }}



    steps:


      - name: Checkout

        uses: actions/checkout@v4



      - name: Show Project

        run: |

          echo "Build Project: $PROJECT"

          ls Projects/$PROJECT



      - name: Install Theos

        run: |

          rm -rf "$HOME/theos"

          git clone --recursive \
          https://github.com/theos/theos.git \
          "$HOME/theos"

          echo "THEOS=$HOME/theos" >> $GITHUB_ENV



      - name: Install SDK

        run: |

          mkdir -p "$HOME/theos/sdks"


          git clone --depth=1 \
          https://github.com/theos/sdks.git \
          "$HOME/theos/sdks"



      - name: Install Tools

        run: |

          brew install ldid || true



      - name: Prepare Project

        run: |

          cp Projects/$PROJECT/Tweak.xm ./Tweak.xm

          cp Projects/$PROJECT/config.json ./config.json


          echo "===== Current Plugin ====="

          cat config.json



      - name: Generate Config

        run: |

          chmod +x Scripts/*.sh


          ./Scripts/make_config.sh

          ./Scripts/make_filter.sh



      - name: Build

        run: |

          export THEOS="$HOME/theos"


          make clean

          make FINALPACKAGE=1



      - name: Output

        run: |

          mkdir output


          cp .theos/obj/*.dylib output/


          ls -al output



      - name: Upload dylib

        uses: actions/upload-artifact@v4


        with:

          name: ${{ env.PROJECT }}-dylib

          path: output/*.dylib
