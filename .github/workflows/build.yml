name: Build Universal iOS Tweak


on:

  workflow_dispatch:

  push:

    branches:

      - main



jobs:


  build:


    runs-on: macos-14



    steps:



      - name: Checkout

        uses: actions/checkout@v4




      - name: Install Theos

        run: |

          rm -rf "$HOME/theos"

          git clone --recursive \
          https://github.com/theos/theos.git \
          "$HOME/theos"

          echo "THEOS=$HOME/theos" >> $GITHUB_ENV




      - name: Install SDK

        run: |

          rm -rf "$HOME/theos/sdks"

          git clone --depth=1 \
          https://github.com/theos/sdks.git \
          "$HOME/theos/sdks"




      - name: Install Tools

        run: |

          brew install ldid || true




      - name: Generate Config Files

        run: |

          chmod +x Scripts/*.sh

          ./Scripts/make_filter.sh

          ./Scripts/make_control.sh


          echo "===== Generated Filter.plist ====="

          cat Filter.plist


          echo "===== Generated control ====="

          cat control




      - name: Build Tweak

        run: |

          export THEOS="$HOME/theos"

          export THEOS_PACKAGE_SCHEME=rootless


          make clean


          make \
          FINALPACKAGE=1 \
          THEOS_PACKAGE_SCHEME=rootless




      - name: Check Output

        run: |

          echo "===== dylib ====="

          find . -name "*.dylib"


          echo "===== deb ====="

          find . -name "*.deb"




      - name: Upload Result

        uses: actions/upload-artifact@v4


        with:


          name: Universal-Tweak-Output


          path: |

            .theos/obj/*.dylib

            packages/*.deb


          if-no-files-found: warn
