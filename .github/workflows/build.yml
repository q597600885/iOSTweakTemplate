name: Build TrollStore Tweak


on:

  workflow_dispatch:

    inputs:

      project:

        description: "输入插件名称"

        required: true

        default: "WoAiKaAdFree"


  push:

    branches:

      - main



jobs:


  build:


    runs-on: macos-14


    env:

      PROJECT: ${{ github.event.inputs.project || 'WoAiKaAdFree' }}



    steps:


      - name: Checkout

        uses: actions/checkout@v4



      - name: Show Project

        run: |

          echo "=============================="

          echo "Current Project: $PROJECT"

          echo "=============================="


          if [ ! -d "Projects/$PROJECT" ]; then

            echo "❌ 插件不存在: $PROJECT"

            echo "当前可用插件:"

            ls Projects

            exit 1

          fi


          echo "✅ 插件存在"


          ls -la Projects/$PROJECT



      # ==========================
      # Install Theos
      # ==========================

      - name: Install Theos

        run: |

          rm -rf $HOME/theos


          git clone --recursive \
          https://github.com/theos/theos.git \
          $HOME/theos


          echo "THEOS=$HOME/theos" >> $GITHUB_ENV



      # ==========================
      # Install SDK
      # ==========================

      - name: Install SDK

        run: |

          rm -rf $HOME/theos/sdks


          mkdir -p $HOME/theos/sdks


          git clone --depth=1 \
          https://github.com/theos/sdks.git \
          $HOME/theos/sdks



      # ==========================
      # Tools
      # ==========================

      - name: Install Tools

        run: |

          brew install ldid || true



      # ==========================
      # Prepare Project
      # ==========================

      - name: Prepare Project

        run: |

          echo "Copy project files"


          cp Projects/$PROJECT/Tweak.xm ./Tweak.xm


          cp Projects/$PROJECT/config.json ./config.json



          echo "===== Current Tweak.xm ====="


          head -50 Tweak.xm



          echo "===== Current Config ====="


          cat config.json



      # ==========================
      # Generate Config
      # ==========================

      - name: Generate Config

        run: |

          chmod +x Scripts/*.sh


          ./Scripts/make_config.sh


          ./Scripts/make_filter.sh



          echo "===== Filter.plist ====="


          cat Filter.plist



      # ==========================
      # Build
      # ==========================

      - name: Build Tweak

        run: |

          export THEOS=$HOME/theos


          make clean


          make FINALPACKAGE=1



      # ==========================
      # Check Output
      # ==========================

      - name: Check Output

        run: |

          echo "===== dylib ====="


          find . -name "*.dylib"



          echo "===== deb ====="


          find . -name "*.deb"



      # ==========================
      # Package
      # ==========================

      - name: Package Output

        run: |

          mkdir -p output


          cp .theos/obj/*.dylib output/ || true


          cp .theos/obj/arm64/*.dylib output/ || true


          cp .theos/obj/arm64e/*.dylib output/ || true



          echo "===== Output ====="


          ls -al output



      # ==========================
      # Upload
      # ==========================

      - name: Upload dylib

        uses: actions/upload-artifact@v4

        with:

          name: ${{ env.PROJECT }}-dylib

          path: output/*.dylib
