name: Build TrollStore Tweak


on:

  workflow_dispatch:

  push:

    branches:
      - main



jobs:


  build:


    runs-on: macos-14



    steps:


      - name: Checkout

        uses: actions/checkout@v4



      - name: Install Theos

        run: |

          rm -rf "$HOME/theos"

          git clone --recursive \
          https://github.com/theos/theos.git \
          "$HOME/theos"

          echo "THEOS=$HOME/theos" >> $GITHUB_ENV



      - name: Install SDK

        run: |

          rm -rf "$HOME/theos/sdks"

          git clone --depth=1 \
          https://github.com/theos/sdks.git \
          "$HOME/theos/sdks"



      - name: Install ldid

        run: |

          brew install ldid || true



      - name: Generate Config

        run: |

          chmod +x Scripts/*.sh


          ./Scripts/make_config.sh


          ./Scripts/make_filter.sh


          echo "===== Config ====="

          cat tweak_config.mk


          echo "===== Filter ====="

          cat Filter.plist




      - name: Build dylib

        run: |

          export THEOS="$HOME/theos"

          export THEOS_PACKAGE_SCHEME=rootless


          make clean


          make \
          FINALPACKAGE=1 \
          THEOS_PACKAGE_SCHEME=rootless




      - name: Prepare dylib

        run: |

          mkdir -p output


          cp .theos/obj/*.dylib output/


          echo "===== Output ====="

          ls -al output




      - name: Upload dylib

        uses: actions/upload-artifact@v4


        with:


          name: TrollStore-Dylib


          path:

            output/*.dylib
