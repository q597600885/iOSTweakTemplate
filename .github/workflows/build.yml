name: Build TrollStore Tweak


on:

  workflow_dispatch:

    inputs:

      project:

        description: "选择编译插件"

        required: true

        default: "WoAiKaAdFree"



  push:

    branches:

      - main



jobs:


  build:


    runs-on: macos-14


    env:

      PROJECT: ${{ github.event.inputs.project || 'WoAiKaAdFree' }}



    steps:


      - name: Checkout

        uses: actions/checkout@v4



      - name: Show Project

        run: |

          echo "======================"

          echo "Build Project: $PROJECT"

          echo "======================"

          ls -la Projects/$PROJECT



      # 安装 Theos

      - name: Install Theos

        run: |

          rm -rf "$HOME/theos"


          git clone --recursive \
          https://github.com/theos/theos.git \
          "$HOME/theos"


          echo "THEOS=$HOME/theos" >> $GITHUB_ENV



      # 安装 SDK

      - name: Install SDK

        run: |

          rm -rf "$HOME/theos/sdks"


          mkdir -p "$HOME/theos/sdks"


          git clone --depth=1 \
          https://github.com/theos/sdks.git \
          "$HOME/theos/sdks"



      # ldid

      - name: Install Tools

        run: |

          brew install ldid || true



      # 准备插件文件

      - name: Prepare Project

        run: |

          echo "Copy project files"


          cp Projects/$PROJECT/Tweak.xm ./Tweak.xm


          cp Projects/$PROJECT/config.json ./config.json


          echo "===== config ====="

          cat config.json



      # 生成 Filter.plist control

      - name: Generate Config

        run: |

          chmod +x Scripts/*.sh


          ./Scripts/make_config.sh


          ./Scripts/make_filter.sh



      # 编译

      - name: Build Tweak

        run: |

          export THEOS="$HOME/theos"


          make clean


          make FINALPACKAGE=1



      # 查看输出

      - name: Check Output

        run: |

          echo "===== dylib ====="


          find . -name "*.dylib"


          echo "===== deb ====="


          find . -name "*.deb"



      # 输出 dylib

      - name: Package Output

        run: |

          mkdir -p output


          cp .theos/obj/*.dylib output/ || true


          cp .theos/obj/arm64e/*.dylib output/ || true


          ls -al output



      # 上传

      - name: Upload dylib

        uses: actions/upload-artifact@v4


        with:


          name: ${{ env.PROJECT }}-dylib


          path: output/*.dylib
